<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f3eddf"><title>余烬远征 · 五人战术爬塔</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="ui-v4.css"></head>
<body><div id="app"><main class="game-shell">
<header class="game-header"><div class="chapter"><div class="brand">余烬远征</div><div class="chapter-line"><span class="floor-large"><span id="floor">01</span><small>/ 15</small></span><div><h1 id="floor-title">遗忘庭院</h1><p id="floor-desc">猎手伏击</p></div></div><div id="floor-track" aria-label="远征进度"></div></div>
<div class="top-actions"><div class="resources"><span><b id="gold">200</b><small>金币</small></span><span><b id="essence">12</b><small>余烬</small></span></div><nav class="section-nav" aria-label="游戏功能"><button data-view="growth">英雄成长</button><button data-view="forge">工坊装备</button></nav><details id="more-menu"><summary aria-label="打开远征菜单">菜单</summary><div class="menu-sheet"><button id="edit-party">调整阵容</button><button data-view="club">俱乐部杯赛</button><button id="help">远征手册</button><button id="log-toggle" aria-label="展开战斗日志" aria-expanded="false">战斗记录</button><div id="route-options"></div><div id="display-options"></div><button id="reset">新远征</button><small>进度自动保存在此浏览器</small></div></details></div></header>
<section class="arena-wrap" aria-label="远征战场"><div class="arena" id="arena"><canvas id="battlefield" aria-label="五人战术战场"></canvas><div class="battle-status"><b id="phase">战前部署</b><span id="clock">00:00</span></div><div id="battle-overlay" class="battle-overlay hidden"></div><div id="battle-log" class="battle-log hidden" aria-label="战斗记录"></div><div id="live-threats"></div></div></section>
<section class="battle-dock" aria-label="战斗操作"><div class="squad-dock"><div id="party" class="party-grid"></div><button id="tactics-open" class="dock-tactics">战术</button></div><div id="command-slot"></div><div class="action-dock"><div class="battle-settings"><button id="speed" aria-label="切换战斗速度">1×</button><button id="pause" disabled>暂停</button></div><button id="start" class="primary">开始战斗</button></div></section>
<div class="status-strip"><p id="battle-hint">点击英雄配置成长与战术</p><div id="relic-slot"></div></div><button id="start-top" hidden tabindex="-1" aria-hidden="true">开始战斗</button>
</main><div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-panel"><button id="close-modal" class="close" aria-label="关闭">×</button><div id="modal-content"></div></div></div><div id="toast" role="status"></div></div><script type="module" src="app.js"></script></body></html>
